name: Provider request contracts

on:
  push:
    branches: [feat/reasoning-inquiry]
    paths:
      - "cognitive_core/engine/**"
      - "cognitive_core/inquiry/**"
      - "tests/unit/**"
      - "pyproject.toml"
      - ".github/workflows/provider-contracts.yml"
  pull_request:
    paths:
      - "cognitive_core/engine/**"
      - "cognitive_core/inquiry/**"
      - "tests/unit/**"
      - "pyproject.toml"
      - ".github/workflows/provider-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit and SDK contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the actual OpenAI SDK integration
        run: python -m pip install -e ".[inquiry]" langchain-openai
      - name: Verify SDK availability and record versions
        run: |
          python -c "import langchain_openai, openai, httpx"
          python -m pip show langchain-openai openai httpx
      - name: Run unit tests, including offline real-SDK requests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -q
